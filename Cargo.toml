[package]
name = "emmu-nds"
version = "0.1.0"
edition = "2021"
description = "Nintendo DS core for Emmu (web + desktop through WASM)"
repository = "https://github.com/EspetoRx/emmu-nds"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dust-core = { path = "vendor/dust/core" }
dust-soft-2d = { path = "vendor/dust/render/soft-2d" }
dust-soft-3d = { path = "vendor/dust/render/soft-3d" }
emu-utils = { path = "vendor/emu-utils" }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch."https://github.com/kelpsyberry/emu-utils"]
emu-utils = { path = "vendor/emu-utils" }

[patch."https://github.com/kelpsyberry/arm-decoder"]
arm-decoder = { path = "vendor/arm-decoder" }

[workspace]
members = [
    "vendor/dust/core",
    "vendor/dust/render/soft-2d/base",
    "vendor/dust/render/soft-2d",
    "vendor/dust/render/soft-3d",
]
exclude = ["vendor/emu-utils", "vendor/arm-decoder"]

[profile.release]
opt-level = 2
panic = "abort"
